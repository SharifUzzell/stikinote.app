<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stiki — coming soon</title>
<meta name="description" content="Sticky notes for your Home Screen. Write a note, pin it as a widget — and let Stacks cycle your quotes and affirmations through the day.">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta property="og:title" content="Stiki: Sticky Notes & Widgets">
<meta property="og:description" content="Sticky notes for your Home Screen. Write a note, pin it as a widget — and let Stacks cycle your quotes and affirmations through the day.">
<meta property="og:image" content="https://stikinote.app/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
<header>
  <a class="brand" href="/"><img src="/icon.png" alt="" width="44" height="44">Stiki</a>
  <nav><a href="/support">Support</a><a href="/privacy">Privacy</a></nav>
</header>
<section class="holding">
  <div class="wait">
    <img src="/logo.png" alt="Three Stiki sticky notes fanned out">
    <h1>Sticky notes for your Home Screen.</h1>
    <p>Stiki is in private beta. Leave your email and you'll get the TestFlight invite when the next round opens.</p>
    <form id="waitlist" class="waitlist" action="WAITLIST_ENDPOINT" method="POST">
      <label class="sr" for="email">Email</label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
      <input type="text" name="_gotcha" class="sr" tabindex="-1" autocomplete="off">
      <button class="chip accent" type="submit">Join the waitlist</button>
    </form>
    <p class="fine-note" id="note">No spam, no sharing — one email when it's your turn.</p>
  </div>
</section>
<footer>
  <div><a href="/">Stiki</a><a href="/support">Support</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div>
  <div>© 2026 Sharif Uzzell · hello@stikinote.app</div>
</footer>
</div>
<script>
  // Until a form backend is wired (action="WAITLIST_ENDPOINT"), the form
  // hands off to the mail app — nothing is lost, nothing is collected here.
  const form = document.getElementById('waitlist');
  const note = document.getElementById('note');
  form.addEventListener('submit', async (e) => {
    const email = form.email.value.trim();
    if (form.action.endsWith('WAITLIST_ENDPOINT')) {
      e.preventDefault();
      location.href = 'mailto:hello@stikinote.app?subject=' + encodeURIComponent('Stiki waitlist') +
        '&body=' + encodeURIComponent('Please add ' + email + ' to the Stiki beta waitlist.');
      note.textContent = 'Opening your mail app — send that and you\'re on the list.';
      return;
    }
    e.preventDefault();
    try {
      const r = await fetch(form.action, { method: 'POST', headers: { 'Accept': 'application/json' },
        body: new FormData(form) });
      note.textContent = r.ok ? 'You\'re on the list. Talk soon.' : 'That didn\'t go through — email hello@stikinote.app instead.';
      if (r.ok) form.reset();
    } catch { note.textContent = 'That didn\'t go through — email hello@stikinote.app instead.'; }
  });
</script>
</body>
</html>
